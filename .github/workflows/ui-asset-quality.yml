name: UI Asset Quality Checks

on:
  pull_request:
    paths:
      - "scripts/*.py"
      - "tests/*.py"
      - "skills/semantic-asset-export/**"
      - "docs/ICON_ASSET_ALIGNMENT.md"
      - ".github/workflows/ui-asset-quality.yml"
  push:
    branches: [main]
    paths:
      - "scripts/*.py"
      - "tests/*.py"
      - ".github/workflows/ui-asset-quality.yml"

permissions:
  contents: read

jobs:
  png-html-visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image testing dependency
        run: python -m pip install Pillow
      - name: Run synthetic PNG, HTML, alignment, and visual quality tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
